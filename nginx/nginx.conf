events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend_cluster {
        # Round-robin distribution between the two backend API container replicas
        server api_1:8000 max_fails=3 fail_timeout=10s;
        server api_2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend React Single Page Application
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Backend API routes
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure upstream headers like X-Served-By and X-Correlation-ID pass to the client
            proxy_pass_header X-Served-By;
            proxy_pass_header X-Correlation-ID;
            proxy_pass_header X-Cache-Lookup;
            proxy_pass_header Idempotency-Key;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Swagger and OpenAPI documentation
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
        }

        # Health & Readiness Probes
        location ~ ^/(health|ready) {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_pass_header X-Served-By;
        }

        # Mock payment gateway proxy
        location /gateway/ {
            rewrite ^/gateway/(.*) /$1 break;
            proxy_pass http://gateway:8001;
            proxy_set_header Host $host;
        }
    }
}
